<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title or ('Notice' if code == 200 else 'Error ' ~ code) }}</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(to right, #1f4037, #99f2c8); color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .box { background: rgba(23,23,23,0.7); padding: 30px; border-radius: 10px; max-width: 480px; width: 90%; text-align: center; }
        a { color: #99f2c8; }
    </style>
</head>
<body>
    <main class="box" role="main">
        <h1>{{ title or ('Notice' if code == 200 else 'Something went wrong') }}</h1>
        <p role="alert">{{ message }}</p>
        <p><a href="{{ url_for('second_page') }}">Back to Home</a></p>
    </main>
</body>
</html>
